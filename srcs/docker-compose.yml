name: test

services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    container_name: ngnix
    environment:
      - NGNIX_CRT_FILE=/run/secrets/ngnix_crt
      - NGNIX_KEY_FILE=/run/secrets/ngnix_key
    ports:
      - "8443:443"
      # - "8088:8088"
    networks:
      - inseption
    depends_on:
      - wordpress
    secrets:
      - ngnix_crt
      - ngnix_key
    volumes:
      - ./requirements/nginx/conf/defualt.conf:/etc/nginx/conf.d/defualt.conf
      - web-data:/var/www/html

  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    container_name: wordpress
    environment:
      - DB_NAME=wordpress
      - DB_USER=wordpress
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_HOST=mariadb
    secrets:
      - db_password
    networks:
      - inseption
    depends_on:
      - mariadb
    volumes:
      - ./requirements/wordpress/conf/www.conf:/etc/php/8.2/fpm/pool.d/www.conf
      - web-data:/var/www/html


  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    container_name: mariadb
    environment:
      - DB_NAME=wordpress
      - DB_USER=wordpress
      - DB_PASSWORD_FILE=/run/secrets/db_password
      - DB_ADMIN_USER_FILE=/run/secrets/db_admin_user
      - DB_ADMIN_PASSWORD_FILE=/run/secrets/db_admin_password
    secrets:
      - db_password
      - db_admin_user
      - db_admin_password
    networks:
      - inseption
    volumes:
      - ./requirements/mariadb/conf/server.cnf:/etc/mysql/mariadb.conf.d/50-server.cnf

networks:
  inseption:
    driver:
      "bridge"

secrets:
  db_password:
    file: ./secrets/db_password.txt
  db_admin_user:
    file: ./secrets/db_admin_user.txt
  db_admin_password:
    file: ./secrets/db_admin_password.txt
  ngnix_crt:
    file: ./secrets/ssl/nginx.crt
  ngnix_key:
    file: ./secrets/ssl/nginx.key

volumes:
  web-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./web